version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: indexium-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://indexium:indexium123@db:5432/indexium_db
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_RANKER=bm25
    depends_on:
      - db
      - redis
    volumes:
      - ../index_data:/app/index_data

  redis:
    image: redis:7-alpine
    container_name: indexium-redis
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    container_name: indexium-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=indexium
      - POSTGRES_PASSWORD=indexium123
      - POSTGRES_DB=indexium_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
