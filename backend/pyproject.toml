[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indexium-backend"
version = "1.0.0"
description = "Indexium - Replication of Google page indexing and search engine"
authors = [{ name = "uday" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "httpx",
    "python-dotenv",
]

[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]
asyncio_mode = "auto"
